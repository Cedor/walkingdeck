name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: composer lint
      - run: npm ci
      - run: npm run lint

  php-tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.2"]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test

  php-coverage:
    name: PHP coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist
      - run: mkdir -p build
      - run: composer test:coverage
      - run: php scripts/check-coverage.php build/coverage.xml 60
      - uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: build/coverage.xml

  javascript-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  database-tests:
    name: MariaDB schema and fixtures
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: walkingdeck_test
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Load schema and reference data
        run: mysql --host 127.0.0.1 --user root --password=test walkingdeck_test < dbmodel.sql
      - name: Assert schema invariants
        run: mysql --host 127.0.0.1 --user root --password=test walkingdeck_test < tests/sql/assert-schema.sql
